name: Release

# Auto-bump @pinace/core minor version + publish to npm on every push to main.
# Skips itself when the commit message starts with "chore: release" (avoids loop).

on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Auto-publish @pinace/core
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bump @pinace/core minor version (+0.1.0)
        id: bump
        working-directory: packages/core
        run: |
          npm version minor --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumped to v$new_version"

      - name: Publish to npm
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json
          git commit -m "chore: release @pinace/core v${{ steps.bump.outputs.version }}"
          git tag "core-v${{ steps.bump.outputs.version }}"
          git push origin main --follow-tags
